// 1️⃣ First, buildscript block
buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven {
            url = uri("https://storage.googleapis.com/download.flutter.io")
        }
    }

    dependencies {
        classpath "com.android.tools.build:gradle:$agpVersion_ext"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion_ext"
    }
}

// 2️⃣ Then, plugins block (apply false)
plugins {
    id "com.android.application" apply false
    id "com.android.library" apply false
    id "org.jetbrains.kotlin.android" apply false
}

// 3️⃣ Other root project settings
rootProject.buildDir = "../build"

apply from: "${rootDir}/versions.gradle"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

