apply plugin: "com.android.application"
apply plugin: "kotlin-android"

// Apply Flutter Gradle plugin (local to Flutter SDK)
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"

// Import versions from versions.gradle
apply from: "$rootDir/versions.gradle"

android {
    namespace "com.mtulli.sudoku"

    compileSdkVersion compileSdkVersion_ext
    ndkVersion ndkMain_ext

    defaultConfig {
        applicationId "com.mtulli.sudoku"
        minSdkVersion minSdkVersion_ext
        targetSdkVersion targetSdkVersion_ext
        versionCode flutter.versionCode.toInteger()
        versionName flutter.versionName
    }

    signingConfigs {
        release {
            if (System.getenv("KEYSTORE_PASSWORD")) {
                storeFile file(System.getenv("KEYSTORE_PATH"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"

            // Flutter 3.16+ requirement
            ndk {
                debugSymbolLevel = "FULL"
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    packagingOptions {
        jniLibs.useLegacyPackaging = false
    }
}

dependencies {
    // Flutter injects everything automatically
}