plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android" version "1.9.22"  // Plugin version must stay here
    id "dev.flutter.flutter-gradle-plugin"
}

apply from: "${rootDir}/versions.gradle"

android {
    namespace "com.mtulli.sudoku"

    compileSdkVersion compileSdkVersion_ext
    ndkVersion ndkMain_ext

    defaultConfig {
        applicationId "com.mtulli.sudoku"
        minSdkVersion minSdkVersion_ext
        targetSdkVersion targetSdkVersion_ext
        versionCode flutter_versionCode.toInteger()
        versionName flutter_versionName
    }

    compileOptions {
        sourceCompatibility java_version
        targetCompatibility java_version
    }

    kotlinOptions {
        jvmTarget = jvm_target
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile(
                "proguard-android-optimize.txt"
            ), "proguard-rules.pro"

            ndk {
                debugSymbolLevel = "FULL"
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    packagingOptions {
        jniLibs.useLegacyPackaging = false
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    // Add other dependencies here
}
