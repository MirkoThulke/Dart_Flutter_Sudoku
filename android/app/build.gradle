def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream ->
        localProperties.load(stream)
    }
}

def flutterRoot = localProperties.getProperty("flutter.sdk")
if (flutterRoot == null) {
    flutterRoot = System.getenv("FLUTTER_ROOT")
}

if (flutterRoot == null) {
    throw new GradleException(
        "Flutter SDK not found. Define flutter.sdk in local.properties or set FLUTTER_ROOT"
    )
}

apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"

plugins {
    id "com.android.application"
}

apply from: "${rootDir}/versions.gradle"

android {
    namespace "com.mtulli.sudoku"

    compileSdkVersion compileSdkVersion_ext
    ndkVersion ndkMain_ext

    defaultConfig {
        applicationId "com.mtulli.sudoku"
        minSdkVersion minSdkVersion_ext
        targetSdkVersion targetSdkVersion_ext
        versionCode flutter.versionCode.toInteger()
        versionName flutter.versionName
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile(
                "proguard-android-optimize.txt"
            ), "proguard-rules.pro"

            ndk {
                debugSymbolLevel = "FULL"
            }
        }
    }

    buildFeatures {
        buildConfig true
    }
}
