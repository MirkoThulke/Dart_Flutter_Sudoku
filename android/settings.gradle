// 1️⃣ FIRST — nothing before this
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    resolutionStrategy {
        eachPlugin {
            if (requested.id.id.startsWith("com.android.")) {
                useModule("com.android.tools.build:gradle:8.4.2")
            }
        }
    }
}

// 2️⃣ SECOND — nothing before this except pluginManagement
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

// 3️⃣ THIRD — plugins block MUST be here
plugins {
    id "dev.flutter.flutter-gradle-plugin" version "1.0.0" apply false
}

// 4️⃣ ONLY AFTER plugins {}
rootProject.name = "android"
include(":app")
