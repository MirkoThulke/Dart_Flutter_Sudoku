pluginManagement {
    def flutterSdk = System.getenv("FLUTTER_ROOT")
    if (!flutterSdk) {
        throw new GradleException("FLUTTER_ROOT is not set")
    }

    // Flutter's Gradle plugin (read-only)
    includeBuild("$flutterSdk/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()

        // Flutter engine Maven repo (READ-ONLY, SDK-managed)
        maven {
            url = uri("$flutterSdk/bin/cache/artifacts/engine/android")
        }

        gradlePluginPortal()
    }

    plugins {
        id "com.android.application" version "8.4.2"
        id "com.android.library" version "8.4.2"
        id "org.jetbrains.kotlin.android" version "1.9.22"
        id "dev.flutter.flutter-gradle-plugin"
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()

        // Fallback: Flutter hosted engine artifacts
        maven {
            url = uri("https://storage.googleapis.com/download.flutter.io")
        }
    }
}

rootProject.name = "android"
include(":app")