pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    // Only declare Kotlin with a version
    plugins {
        id "org.jetbrains.kotlin.android" version "1.9.22"
    }

    // Use resolution strategy for Android plugins
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id.startsWith("com.android.")) {
                useModule("com.android.tools.build:gradle:8.4.2")
            }
        }
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT) // instead of PREFER_SETTINGS
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "android"
include(":app")

