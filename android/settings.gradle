// ======================================================
// Resolve Flutter SDK path ONCE (real Groovy variable)
// ======================================================
def FLUTTER_SDK = System.getenv("FLUTTER_ROOT")
if (FLUTTER_SDK == null || FLUTTER_SDK.trim().isEmpty()) {
    throw new GradleException("FLUTTER_ROOT is not set")
}

def FLUTTER_ENGINE_MAVEN =
        uri("${FLUTTER_SDK}/bin/cache/artifacts/engine/android")

// ======================================================
// Plugin management
// ======================================================
pluginManagement {
    includeBuild("${FLUTTER_SDK}/packages/flutter_tools/gradle")

    repositories {
        maven { url = FLUTTER_ENGINE_MAVEN }
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    plugins {
        id "com.android.application" version "8.4.2"
        id "com.android.library" version "8.4.2"
        id "org.jetbrains.kotlin.android" version "1.9.22"
        id "dev.flutter.flutter-gradle-plugin"
    }
}

// ======================================================
// Dependency resolution
// ======================================================
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        maven { url = FLUTTER_ENGINE_MAVEN }
        google()
        mavenCentral()
    }
}

rootProject.name = "android"
include(":app")
