// 1️⃣ FIRST — pluginManagement ONLY
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    resolutionStrategy {
        eachPlugin {
            if (requested.id.id.startsWith("com.android.")) {
                useModule("com.android.tools.build:gradle:8.4.2")
            }
        }
    }
}

// 2️⃣ SECOND — plugins block
plugins {
    id "dev.flutter.flutter-gradle-plugin" version "1.0.0" apply false
}

// 3️⃣ THIRD — dependency resolution (MUST be after plugins)
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

// 4️⃣ LAST — project structure
rootProject.name = "android"
include(":app")
