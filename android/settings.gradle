pluginManagement {

    // -----------------------------------------
    // Resolve Flutter SDK safely
    // -----------------------------------------

    def flutterSdk = System.getenv("FLUTTER_HOME")

    if (flutterSdk == null) {
        def localProperties = new Properties()
        def localFile = file("local.properties")

        if (localFile.exists()) {
            localFile.withInputStream { localProperties.load(it) }
            flutterSdk = localProperties.getProperty("flutter.sdk")
        }
    }

    if (flutterSdk == null) {
        throw new GradleException(
            "Flutter SDK not found. Define FLUTTER_HOME or flutter.sdk in local.properties"
        )
    }

    includeBuild("${flutterSdk}/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    plugins {
        id "com.android.application" version "8.4.2"
        id "com.android.library" version "8.4.2"
        id "org.jetbrains.kotlin.android" version "1.9.22"
    }
}


// ------------------------------------------------------------
// Dependency Resolution
// ------------------------------------------------------------

dependencyResolutionManagement {

    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url = uri("https://storage.googleapis.com/download.flutter.io") }
    }
}

rootProject.name = "android"
include(":app")

