pluginManagement {
    // Flutter SDK path (read-only)
    def FLUTTER_SDK = System.getenv("FLUTTER_ROOT")
    if (!FLUTTER_SDK) {
        throw new GradleException("FLUTTER_ROOT is not set")
    }

    // Maven path for Flutter engine artifacts (optional override)
    // But during CI builds, Gradle resolves into GRADLE_USER_HOME anyway
    def FLUTTER_ENGINE_MAVEN = System.getenv("FLUTTER_ENGINE_MAVEN") 
            ?: "${FLUTTER_SDK}/bin/cache/artifacts/engine/android"

    includeBuild("${FLUTTER_SDK}/packages/flutter_tools/gradle")

    repositories {
        // Use FLUTTER_ENGINE_MAVEN as read-only fallback (SDK cache)
        maven { url = uri(FLUTTER_ENGINE_MAVEN) }
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    plugins {
        id "com.android.application" version "8.4.2"
        id "com.android.library" version "8.4.2"
        id "org.jetbrains.kotlin.android" version "1.9.22"
        id "dev.flutter.flutter-gradle-plugin"
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        // Gradle will primarily resolve engine artifacts into GRADLE_USER_HOME
        // but keep this as a fallback for local development
        maven { url = uri(System.getenv("FLUTTER_ENGINE_MAVEN") ?: "${FLUTTER_SDK}/bin/cache/artifacts/engine/android") }
        google()
        mavenCentral()
    }
}

rootProject.name = "android"
include(":app")