// ===============================
// GLOBAL (top-level) variable
// ===============================
def flutterSdkPath = System.getenv("FLUTTER_ROOT")
if (flutterSdkPath == null) {
    throw new GradleException("FLUTTER_ROOT is not set")
}

// ===============================
// Plugin management
// ===============================
pluginManagement {
    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        maven { url = uri("$flutterSdkPath/bin/cache/artifacts/engine/android") }
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    plugins {
        id "com.android.application" version "8.4.2"
        id "com.android.library" version "8.4.2"
        id "org.jetbrains.kotlin.android" version "1.9.22"
        id "dev.flutter.flutter-gradle-plugin"
    }
}

// ===============================
// Dependency resolution
// ===============================
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        maven { url = uri("$flutterSdkPath/bin/cache/artifacts/engine/android") }
        google()
        mavenCentral()
    }
}

rootProject.name = "android"
include(":app")
