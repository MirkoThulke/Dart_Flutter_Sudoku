pluginManagement {
    // Read environment variables dynamically
    def FLUTTER_SDK = System.getenv("FLUTTER_ROOT")
    if (!FLUTTER_SDK) {
        throw new GradleException("FLUTTER_ROOT is not set")
    }

    // Flutter engine Maven repo — use writable container cache
    def CONTAINER_CACHE = System.getenv("CONTAINER_CACHE")
    if (!CONTAINER_CACHE) {
        throw new GradleException("CONTAINER_CACHE is not set")
    }

    def FLUTTER_ENGINE_MAVEN = System.getenv("FLUTTER_ENGINE_MAVEN")
            ?: "${CONTAINER_CACHE}/flutter-engine"

    includeBuild("${FLUTTER_SDK}/packages/flutter_tools/gradle")

    repositories {
        // Use dynamic engine path
        maven { url = uri(FLUTTER_ENGINE_MAVEN) }
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    plugins {
        id "com.android.application" version "8.4.2"
        id "com.android.library" version "8.4.2"
        id "org.jetbrains.kotlin.android" version "1.9.22"
        id "dev.flutter.flutter-gradle-plugin"
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        maven { url = uri(System.getenv("FLUTTER_ENGINE_MAVEN") ?: "${System.getenv('GRADLE_USER_HOME')}/flutter-engine") }
        google()
        mavenCentral()
    }
}

rootProject.name = "android"
include(":app")