pluginManagement {
    // Use FLUTTER_ROOT directly
    def flutterSdkPath = System.getenv("FLUTTER_ROOT")
    if (flutterSdkPath == null) {
        throw new GradleException("Flutter SDK not found. Set FLUTTER_ROOT in the environment")
    }

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        // Flutter engine artifacts
        maven { url = uri("$flutterSdkPath/bin/cache/artifacts/engine/android") }
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    plugins {
        id "com.android.application" version "8.4.2"
        id "com.android.library" version "8.4.2"
        id "org.jetbrains.kotlin.android" version "1.9.22"
        id "dev.flutter.flutter-gradle-plugin"
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        maven { url = uri("$flutterSdkPath/bin/cache/artifacts/engine/android") }
        google()
        mavenCentral()
    }
}

rootProject.name = "android"
include(":app")