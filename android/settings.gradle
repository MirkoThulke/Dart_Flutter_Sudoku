pluginManagement {

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    def flutterSdk = System.getenv("FLUTTER_ROOT")

    if (flutterSdk == null) {
        def localProperties = new Properties()
        def localPropertiesFile = new File(rootDir, "local.properties")
        if (localPropertiesFile.exists()) {
            localPropertiesFile.withInputStream { localProperties.load(it) }
            flutterSdk = localProperties.getProperty("flutter.sdk")
        }
    }

    if (flutterSdk == null) {
        throw new GradleException("Flutter SDK not found. Set FLUTTER_ROOT or flutter.sdk")
    }

    includeBuild("$flutterSdk/packages/flutter_tools/gradle")

    plugins {
        id "com.android.application" version "8.4.2" apply false
        id "com.android.library" version "8.4.2" apply false
        id "org.jetbrains.kotlin.android" version "1.9.22" apply false
    }
}

dependencyResolutionManagement {

    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url = uri("https://storage.googleapis.com/download.flutter.io") }
    }
}

rootProject.name = "Dart_Flutter_Sudoku"
include(":app")
