dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
}

pluginManagement {
    def flutterSdkPath = System.getenv("FLUTTER_ROOT")
    assert flutterSdkPath != null : "❌ FLUTTER_ROOT environment variable is not set!"

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url = uri("$flutterSdkPath/packages/flutter_tools/gradle") }
    }

    // 🔒 AGP MUST be pinned BEFORE Flutter is included
    plugins {
        id "com.android.application" version "8.4.2"
        id "com.android.library"     version "8.4.2"
    }

    // ⚠️ This MUST come AFTER the pin
    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    resolutionStrategy {
        eachPlugin {
            if (requested.id.id.startsWith("com.android.")) {
                useModule("com.android.tools.build:gradle:8.4.2")
            }
        }
    }
}

plugins {
    id("dev.flutter.flutter-plugin-loader") version "1.0.0"
}

include(":app")

