# Here the instructions define your application as a service called "app".
# This service is built from the Dockerfile in the current directory.
# You can add other services your application may depend on here, such as a
# database or a cache. For examples, see the Awesome Compose repository:
# https://github.com/docker/awesome-compose

services:
  jenkins:
    build:
      # Build Jenkins image from Dockerfile in current directory. Do not pull from Docker Hub.
      context: .
      dockerfile: Dockerfile
    image: jenkins_sudoku_image:2.528.3
    container_name: jenkins_sudoku_container

    # Run Jenkins as the same UID/GID as host-mounted files
    user: "2000:2000"
    group_add:
      - 1001   # host docker group

    environment:
      TZ: Europe/Paris
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"

    restart: unless-stopped

    ports:
      - "8080:8080"    # Jenkins Web UI
      - "50000:50000"  # Jenkins agent port

    volumes:
      # Jenkins home folder
      - /home/mirko/jenkins_host_workspace:/var/jenkins_home
      # Docker socket for Docker-outside-of-Docker
      - /var/run/docker.sock:/var/run/docker.sock

    networks:
      - jenkins_net

networks:
  jenkins_net:
    driver: bridge
